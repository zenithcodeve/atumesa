<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffcd00" />
    <title>Panel Aliado | TuMesa</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js" defer></script>
  </head>
  <body data-page="ally-panel">
    <div class="app">
      <div class="topbar">
        <div><strong>Panel Aliado</strong><br><span class="pill">Gestiona tu negocio</span></div>
        <a href="index.html.html" class="pill">← Inicio</a>
      </div>

      <div id="message"></div>

      <section class="hero">
        <h1>Gestiona tu negocio</h1>
        <p>Administra productos, promociones y disponibilidad de tu tienda.</p>
      </section>

      <div class="card">
        <h3>Agregar producto</h3>
        <form id="productForm">
          <input id="productName" class="input" type="text" placeholder="Nombre del producto" required />
          <input id="productPriceUsd" class="input" type="number" step="0.01" placeholder="Precio en USD" required />
          <input id="productCategory" class="input" type="text" placeholder="Categoría" required />
          <input id="productImageUrl" class="input" type="url" placeholder="URL de foto" />
          <input id="productImageFile" class="input" type="file" accept="image/*" />
          <button class="btn btn-primary" type="submit">Guardar producto</button>
        </form>
      </div>

      <div class="card">
        <h3>Productos</h3>
        <div id="allyProducts"></div>
      </div>

      <div class="card">
        <h3>Crear promoción</h3>
        <form id="promoForm">
          <input id="promoTitle" class="input" type="text" placeholder="Ej. 2x1 en pizzas" required />
          <button class="btn btn-primary" type="submit">Crear promoción</button>
        </form>
      </div>
    </div>
  </body>
</html>
